:root{--bg:#2b1119;--ink:#f7ebe6;--rose:#e9a1ae;--mute:#c9a9ae;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}

p.msg{font-size:1.55rem;line-height:1.45;font-style:italic;margin:0 auto;max-width:30ch}
p.fin{font-size:3.2rem;font-style:italic;font-weight:600;color:var(--rose);margin:26px 0 0;line-height:1}
